[project]
name = "pawnpro-backend"
version = "2.0.0"
description = "Gold & Silver Pawn Register — FastAPI backend (Cloudflare Python Worker)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.111.0",
    "asyncpg==0.31.0",
    "pydantic==2.9.2",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.3",
    "python-dotenv==1.0.1",
    "pandas==2.2.3",
    "openpyxl==3.1.2",
    "httpx==0.27.0",
]

# Local-only tooling: uvicorn for `uvicorn main:app` during local dev, never
# required in the Cloudflare Worker (Cloudflare provides its own ASGI server).
[dependency-groups]
dev = [
    "uvicorn[standard]==0.30.1",
    "workers-py",
    "workers-runtime-sdk",
]

# App-style project (not an installable package) — uv manages deps only.
[tool.uv]
package = false
